<!-- Settings Modal -->
<div id="settings-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-surface-container rounded-xl p-6 w-96 border border-[#272D33] shadow-2xl">
        <h2 class="text-xl font-bold mb-4">Settings</h2>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2 text-on-surface-variant">System Persona</label>
            <input type="text" id="persona-input" class="w-full bg-[#080A0C] border border-[#272D33] rounded-lg p-2 text-on-surface focus:outline-none focus:border-primary" placeholder="e.g. Speak like a pirate">
        </div>
        <div class="flex justify-end gap-2">
            <button id="close-settings" class="px-4 py-2 text-on-surface-variant hover:text-on-surface">Cancel</button>
            <button id="save-settings" class="px-4 py-2 bg-primary text-[#080A0C] rounded-lg font-bold">Save</button>
        </div>

<script>
    let threadId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);
    let persona = localStorage.getItem("chat_persona") || "You are a helpful AI assistant.";
    const chatMessages = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const sendButton = document.getElementById("send-button");
    const historyList = document.getElementById("history-list");

    function createUserMessageElement(text) {
        return `
        <div class="flex justify-end w-full">
            <div class="max-w-[80%] md:max-w-[70%]">
                <div class="bg-[#161B20] text-on-surface font-body-md text-body-md rounded-2xl rounded-tr-sm p-4 border border-[#272D33] relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container/50"></div>
                    <p>${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</p>
                </div>
            </div>
        </div>
        `;
    }

    function createAIMessageElement(id) {
        return `
        <div class="flex justify-start w-full group" id="${id}">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#161B20] to-[#111519] border border-[#272D33] flex items-center justify-center glow-amber-border mr-4 mt-1 flex-shrink-0 hidden md:flex">
                <span class="font-display-lg text-[16px] text-primary tracking-tight leading-none">N</span>
            </div>
            <div class="max-w-[90%] md:max-w-[80%]">
                <div class="bg-[#111519] text-on-surface font-body-md text-body-md rounded-2xl rounded-tl-sm p-5 border border-[#272D33]">
                    <p class="ai-content whitespace-pre-wrap"></p>
                </div>
            </div>
        </div>
        `;
    }

    async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;

        chatInput.value = "";
        
        // Add user message
        chatMessages.insertAdjacentHTML('beforeend', createUserMessageElement(message));
        
        // Prepare AI message block
        const msgId = 'msg-' + Date.now();
        chatMessages.insertAdjacentHTML('beforeend', createAIMessageElement(msgId));
        const aiContentElement = document.getElementById(msgId).querySelector('.ai-content');
        aiContentElement.innerHTML = '<span id="thinking-' + msgId + '" class="animate-pulse text-on-surface-variant">Thinking...</span>';
        
        chatMessages.parentElement.scrollTo(0, chatMessages.parentElement.scrollHeight);

        let isFirstChunk = true;

        try {
            const response = await fetch("/chat/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message, thread_id: threadId, persona: persona })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n\n");
                buffer = lines.pop(); // Keep the last incomplete part in the buffer
                
                for (const line of lines) {
                    if (line.startsWith("data: ")) {
                        const dataStr = line.substring(6);
                        if (dataStr === "[DONE]") {
                            break;
                        }
                        try {
                            const data = JSON.parse(dataStr);
                            if (data.content) {
                                if (isFirstChunk) {
                                    aiContentElement.innerHTML = '';
                                    isFirstChunk = false;
                                }
                                aiContentElement.textContent += data.content;
                                chatMessages.parentElement.scrollTo(0, chatMessages.parentElement.scrollHeight);
                            } else if (data.error) {
                                aiContentElement.textContent += "\\nError: " + data.error;
                            }
                        } catch (e) {
                            console.error("JSON parse error", e, dataStr);
                        }
                    }
                }
            }
        } catch (error) {
            aiContentElement.textContent = "Error connecting to the server.";
        }
    }

    sendButton.addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // File Upload Logic
    const uploadBtn = document.getElementById("upload-btn");
    const fileInput = document.getElementById("file-input");

    uploadBtn.addEventListener("click", () => {
        fileInput.click();
    });

    fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Show uploading message
        chatMessages.insertAdjacentHTML('beforeend', createAIMessageElement('upload-msg'));
        const uploadMsgElement = document.getElementById('upload-msg').querySelector('.ai-content');
        uploadMsgElement.textContent = `Uploading ${file.name}...`;
        chatMessages.parentElement.scrollTo(0, chatMessages.parentElement.scrollHeight);

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            
            if (response.ok) {
                uploadMsgElement.textContent = `✅ ${result.message}`;
            } else {
                uploadMsgElement.textContent = `❌ Error: ${result.error}`;
            }
        } catch (error) {
            uploadMsgElement.textContent = `❌ Failed to upload document.`;
        }
        
        fileInput.value = ""; // Reset input
    });

    // New Chat Logic
    const newChatBtn = document.getElementById("new-chat-btn");
    if (newChatBtn) {
        newChatBtn.addEventListener("click", () => {
            chatMessages.innerHTML = '';
            threadId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);
        });
    }

    // Settings Modal Logic
    const settingsBtn = document.getElementById("open-settings-btn");
    const settingsModal = document.getElementById("settings-modal");
    const closeSettings = document.getElementById("close-settings");
    const saveSettings = document.getElementById("save-settings");
    const personaInput = document.getElementById("persona-input");

    if (settingsBtn && settingsModal) {
        settingsBtn.addEventListener("click", () => {
            personaInput.value = persona;
            settingsModal.classList.remove("hidden");
        });
        closeSettings.addEventListener("click", () => settingsModal.classList.add("hidden"));
        saveSettings.addEventListener("click", () => {
            persona = personaInput.value.trim() || "You are a helpful AI assistant.";
            localStorage.setItem("chat_persona", persona);
            settingsModal.classList.add("hidden");
        });
    }

    // History Logic
    async function loadHistory() {
        try {
            const res = await fetch("/history");
            const data = await res.json();
            historyList.innerHTML = "";
            if (data.history && data.history.length > 0) {
                data.history.forEach(item => {
                    const li = document.createElement("li");
                    li.innerHTML = `<a href="#" class="flex items-center gap-3 px-4 py-3 text-on-surface-variant font-medium hover:bg-surface-container-high hover:text-on-surface transition-colors duration-200" data-thread="${item.thread_id}">
                        <span class="material-symbols-outlined">chat_bubble</span>
                        <span class="font-label-sm text-label-sm truncate">Chat ${item.thread_id.substring(0,6)}</span>
                    </a>`;
                    li.querySelector("a").addEventListener("click", async (e) => {
                        e.preventDefault();
                        await loadThread(item.thread_id);
                    });
                    historyList.appendChild(li);
                });
            } else {
                historyList.innerHTML = `<li><div class="px-4 py-3 text-on-surface-variant text-sm">No history yet</div></li>`;
            }
        } catch (e) {
            console.error(e);
            historyList.innerHTML = `<li><div class="px-4 py-3 text-error text-sm">Error loading history</div></li>`;
        }
    }

    async function loadThread(id) {
        try {
            const res = await fetch(`/history/${id}`);
            const data = await res.json();
            threadId = id;
            chatMessages.innerHTML = "";
            if (data.messages) {
                data.messages.forEach(msg => {
                    if (msg.role === "user") {
                        chatMessages.insertAdjacentHTML('beforeend', createUserMessageElement(msg.content));
                    } else {
                        const msgId = 'msg-' + Math.random().toString(36).substr(2, 9);
                        chatMessages.insertAdjacentHTML('beforeend', createAIMessageElement(msgId));
                        document.getElementById(msgId).querySelector('.ai-content').textContent = msg.content;
                    }
                });
                chatMessages.parentElement.scrollTo(0, chatMessages.parentElement.scrollHeight);
            }
        } catch (e) {
            console.error(e);
            alert("Error loading thread");
        }
    }

    // Load history on startup
    loadHistory();
</script>
